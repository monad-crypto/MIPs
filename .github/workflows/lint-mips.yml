name: Lint MIPs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: MIP linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test the linter
        run: python3 -m unittest discover scripts

      - name: Flag changes outside the proposals
        if: github.event_name == 'pull_request'
        run: |
          others=$(git diff -z --name-only --diff-filter=d HEAD^1 HEAD | tr '\0' '\n' | { grep -vE '^(MIPs|MRCs)/[^/]+\.md$|^assets/(MIP|MRC)-[0-9]+/' || true; })
          if [ -n "$others" ]; then
            echo "::warning title=Changes outside the proposals::Jekyll publishes every file in this repository and the lint result below comes from the tooling in this PR. Review these files first: $(echo "$others" | tr '\n' ' ')"
          fi

      - name: Check changed assets
        if: github.event_name == 'pull_request'
        run: |
          status=0
          while IFS= read -r -d '' file; do
            [ -f "$file" ] || continue
            name=$(printf '%q' "$file")
            case "${file,,}" in
              *.html|*.htm|*.xhtml|*.xht|*.xml|*.xsl|*.xslt|*.svgz|*.js|*.mjs)
                echo "::error title=asset-type::$name: browsers execute this file type when it is opened on the site; assets must be images, documents or data"
                status=1 ;;
            esac
            if [ "$(head -c 3 "$file")" = "---" ]; then
              echo "::error title=asset-front-matter::$name: Jekyll renders files that start with --- as pages; remove the front matter"
              status=1
            fi
          done < <(git diff -z --name-only --diff-filter=d HEAD^1 HEAD | { grep -z -iE '^assets/' || true; })
          exit $status

      - name: Lint changed proposals
        if: github.event_name == 'pull_request'
        run: |
          git diff -z --name-only --diff-filter=d HEAD^1 HEAD | { grep -z -iE '^(MIPs|MRCs)/[^/]+\.md$' || true; } > changed.lst
          if [ ! -s changed.lst ]; then
            echo "No proposals changed."
            exit 0
          fi
          xargs -0 -a changed.lst python3 scripts/lint_mips.py

      - name: Lint all proposals
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/lint_mips.py
